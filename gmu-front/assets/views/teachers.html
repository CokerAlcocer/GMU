<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/general.css">
    <title>GMU | Registro de docentes</title>
</head>
<body>
    <main>
        <div class="row h-100">
            <section class="col-2 bg-body-tertiary shadow">
                <div class="px-3 pt-4">
                    <h4><i class="bi bi-list"></i> Menú</h4>
                    <br>
                    <div class="d-flex flex-column">
                        <a href="/assets/views/students.html" class="btn btn-outline-primary rounded-4 text-start py-3 mb-3 d-flex align-items-center"><i
                                class="fs-4 bi bi-mortarboard"></i>&nbsp;&nbsp;Estudiantes</a>
                        <a href="/assets/views/teachers.html" class="btn btn-primary rounded-4 text-start py-3 mb-3 d-flex align-items-center"><i
                                class="fs-4 bi bi-eyeglasses"></i>&nbsp;&nbsp;Docentes</a>
                        <a href="/index.html" class="btn btn-outline-danger rounded-4 text-start py-3 mb-3 d-flex align-items-center"><i
                                class="fs-4 bi bi-box-arrow-left"></i>&nbsp;&nbsp;Salir</a>
                    </div>
                </div>
            </section>
            <section class="col-10">
                <div class="px-3 pt-4">
                    <h4>Registro de docentes</h4>
                    <br>
                    <section class="row">
                        <article class="col-8" id="content">
                            <div class="alert alert-secondary border-0 rounded-4">
                                <p class="mb-0">No hay registros</p>
                            </div>
                            <div class="card rounded-4">
                                <div class="card-body p-0 d-flex align-items-stretch">
                                    <div class="bg-body-tertiary me-2 rounded-start-4 d-flex align-items-center">
                                        <span class="px-2 fw-bold">#</span>
                                    </div>
                                    <div class="d-flex align-items-center">
                                        <i class="bi bi-person-circle fs-2 opacity-25 me-3"></i>
                                    </div>
                                    <div class="me-auto py-2">
                                        <p class="mb-0">Nombre del docente</p>
                                        <p class="mb-0 text-secondary fw-lighter">Correo</p>
                                    </div>
                                    <div class="d-flex align-items-center pe-3">
                                        <button class="btn btn-danger rounded-3"><i class="bi bi-trash"></i></button>
                                        <button class="btn btn-primary rounded-3 ms-2"><i class="bi bi-pencil"></i></button>
                                    </div>
                                </div>
                            </div>
                        </article>

                        <article class="col-4">
                            <div class="card rounded-4 mb-3">
                                <div class="card-body">
                                    <p id="form-title">Registrar alumno</p>
                                    <form novalidate class="row">
                                        <div class="col-12">
                                            <div class="form-floating mb-3">
                                                <input type="text" id="fullname" class="form-control" placeholder="fullname" autocomplete="off">
                                                <label for="fullname">Nombre completo</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating mb-3">
                                                <input type="text" id="username" class="form-control" placeholder="username" autocomplete="off">
                                                <label for="username">Nombre de usuario</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating mb-3">
                                                <input type="text" id="email" class="form-control" placeholder="email" autocomplete="off">
                                                <label for="email">Correo electrónico</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <button type="submit" class="btn btn-primary col-12">Registrar</button>
                                        </div>
                                    </form>
                                </div>
                            </div>

                            <section>
                                <div class="alert alert-success rounded-4 border-0 visually-hidden" id="a-success">
                                    <p class="mb-0">Registro exitoso</p>
                                </div>
                                <div class="alert alert-warning rounded-4 border-0 visually-hidden" id="a-warning">
                                    <p class="mb-0">Error</p>
                                </div>
                                <div class="alert alert-danger rounded-4 border-0 visually-hidden" id="a-danger">
                                    <p class="mb-0">Error</p>
                                </div>
                            </section>
                        </article>
                    </section>
                </div>
            </section>
        </div>
    </main>

    <script src="/assets/js/bootstrap.min.bundle.js"></script>
</body>
</html>
