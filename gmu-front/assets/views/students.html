<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/assets/css/general.css">
    <title>GMU | Registro de estudiantes</title>
</head>

<body>
    <main>
        <div class="row h-100">
            <section class="col-2 bg-body-tertiary shadow">
                <div class="px-3 pt-4">
                    <h4><i class="bi bi-list"></i> Menú</h4>
                    <br>
                    <div class="d-flex flex-column">
                        <a href="/assets/views/students.html" class="btn btn-primary rounded-4 text-start py-3 mb-3 d-flex align-items-center"><i
                                class="fs-4 bi bi-mortarboard"></i>&nbsp;&nbsp;Estudiantes</a>
                        <a href="/assets/views/teachers.html" class="btn btn-outline-primary rounded-4 text-start py-3 mb-3 d-flex align-items-center"><i
                                class="fs-4 bi bi-eyeglasses"></i>&nbsp;&nbsp;Docentes</a>
                        <a href="/index.html" class="btn btn-outline-danger rounded-4 text-start py-3 mb-3 d-flex align-items-center"><i
                                class="fs-4 bi bi-box-arrow-left"></i>&nbsp;&nbsp;Salir</a>
                    </div>
                </div>
            </section>
            <section class="col-10">
                <div class="px-3 pt-4">
                    <h4>Registro de estudiantes</h4>
                    <br>
                    <section class="row">
                        <article class="col-12 visually-hidden" id="error-c">
                            <div class="alert alert-danger border-0 rounded-4">
                                <p class="mb-0" id="err-m"></p>
                            </div>
                        </article>
                        <article class="col-8" id="content1">

                        </article>

                        <article class="col-4" id="content2">
                            <div class="card rounded-4 mb-3">
                                <div class="card-body">
                                    <p id="form-title">Registrar alumno</p>
                                    <form novalidate class="row" id="form">
                                        <div class="col-12">
                                            <div class="form-floating mb-3">
                                                <input type="text" id="fullname" class="form-control"
                                                    placeholder="fullname" autocomplete="off">
                                                <label for="fullname">Nombre completo</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating mb-3">
                                                <input type="text" id="username" class="form-control"
                                                    placeholder="username" autocomplete="off">
                                                <label for="username">Nombre de usuario</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <div class="form-floating mb-3">
                                                <input type="text" id="email" class="form-control" placeholder="email"
                                                    autocomplete="off">
                                                <label for="email">Correo electrónico</label>
                                            </div>
                                        </div>
                                        <div class="col-12">
                                            <button id="fb-save" onclick="saveOrUpdate(false)" type="button"
                                                class="btn btn-primary col-12">Registrar</button>
                                            <button id="fb-update" onclick="saveOrUpdate(true)" type="button"
                                                class="visually-hidden btn btn-warning col-12">Actualizar</button>
                                            <button onclick="resetForm()" type="reset"
                                                class="mt-2 btn btn-secondary col-12">Limpiar</button>
                                        </div>
                                    </form>
                                </div>
                            </div>

                            <section>
                                <div id="f-succ" class="alert alert-success rounded-4 border-0 visually-hidden"
                                    id="a-success">
                                    <p class="mb-0" id="f-succ-mess"></p>
                                </div>
                                <div id="f-err" class="alert alert-warning rounded-4 border-0 visually-hidden"
                                    id="a-warning">
                                    <p class="mb-0" id="f-err-mess"></p>
                                </div>
                            </section>
                        </article>
                    </section>
                </div>
            </section>
        </div>
    </main>

    <div class="modal fade" id="confirm-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered border-0">
            <div class="modal-content">
                <div class="modal-body">
                    <h3><i class="bi bi-exclamation-triangle"></i> Atención</h3>
                    <hr>
                    <p>La operación que realizarás a continuacón es <b>irreversible</b> ¿Seguro que deseas continuar?
                    </p>
                    <div class="mt-2 text-end">
                        <button class="btn btn-danger" onclick="remove()">Eliminar</button>
                        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/assets/js/kernel/properties.js"></script>
    <script src="/assets/js/kernel/http.gateway.js"></script>
    <script src="/assets/js/bootstrap.min.bundle.js"></script>
    <script src="/assets/js/modules/students.controller.js"></script>
</body>

</html>
