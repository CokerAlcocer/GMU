spring.application.name=gmu-back

server.port=${SERVER_PORT}
server.ssl.enabled=${SERVER_SSL_ENABLED}
server.ssl.key-store=${SERVER_SSL_KEYSTORE}
server.ssl.key-store-password=${SERVER_SSL_KEYSTORE_PASS}
server.ssl.key-store-type=PKCS12

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
db.url=${DB_URL}
db.user=${DB_USER}
db.password=${DB_PASSWORD}

# secret + spring security first password = jwt.secret -> base64
jwt.secret=${JWT_SECRET}